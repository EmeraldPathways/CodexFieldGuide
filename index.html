<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="A practical, interactive course for learning Codex from Mac setup to a complete project workflow." />
  <title>Codex Field Guide — Learn by building</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236f7cff'/%3E%3Cpath d='M22 18h20v7H29v14h13v7H22z' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #f4f7ff;
      --muted: #aab4cc;
      --quiet: #74809b;
      --bg: #090d18;
      --panel: #10172a;
      --panel-2: #151e34;
      --line: rgba(180, 197, 239, .14);
      --line-strong: rgba(180, 197, 239, .26);
      --accent: #8e9bff;
      --accent-2: #43d5c0;
      --warm: #ffbf69;
      --danger: #ff8089;
      --shadow: 0 18px 60px rgba(0,0,0,.24);
      --radius: 18px;
      --sidebar: 300px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 73% -12%, rgba(91, 104, 255, .18), transparent 31rem),
        radial-gradient(circle at 8% 24%, rgba(67, 213, 192, .06), transparent 25rem),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.62;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--warm); outline-offset: 3px; }
    .app-shell { min-height: 100vh; }
    .topbar {
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 28px;
      background: rgba(9, 13, 24, .86);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto;
      border-radius: 11px; color: #fff; font-weight: 900; letter-spacing: -.08em;
      background: linear-gradient(135deg, var(--accent), #5967e6);
      box-shadow: 0 8px 24px rgba(107, 120, 255, .35);
    }
    .brand-copy { line-height: 1.15; }
    .brand-copy strong { display: block; font-size: 13px; letter-spacing: .13em; }
    .brand-copy span { display: block; margin-top: 4px; color: var(--quiet); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .progress-chip { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .progress-bar { width: 105px; height: 7px; background: rgba(255,255,255,.1); border-radius: 999px; overflow: hidden; }
    .progress-bar > span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s ease; }
    .icon-button, .outline-button, .primary-button, .ghost-button {
      border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--ink);
      min-height: 42px; padding: 0 14px; transition: .18s ease; font-weight: 700;
    }
    .icon-button { display: none; padding: 0; width: 42px; font-size: 20px; }
    .outline-button:hover, .ghost-button:hover, .icon-button:hover { border-color: var(--line-strong); background: rgba(255,255,255,.05); }
    .primary-button { border-color: transparent; background: var(--accent); color: #090d18; }
    .primary-button:hover { background: #a6afff; transform: translateY(-1px); }
    .ghost-button { color: var(--muted); }
    .layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 72px; height: calc(100vh - 72px); overflow-y: auto; padding: 24px 18px 30px;
      border-right: 1px solid var(--line); background: rgba(10, 15, 28, .58);
    }
    .sidebar-intro { padding: 0 10px 18px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 9px; color: var(--accent-2); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .sidebar-intro h1 { margin: 0; font-size: 21px; line-height: 1.15; letter-spacing: -.04em; }
    .sidebar-intro p { margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .side-progress { margin: 17px 0 16px; padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.03); }
    .side-progress-row { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .side-progress-row strong { color: var(--ink); }
    .side-progress .progress-bar { width: 100%; margin-top: 10px; }
    .lesson-nav { display: grid; gap: 4px; margin-top: 8px; }
    .lesson-link {
      width: 100%; display: grid; grid-template-columns: 34px minmax(0,1fr) 17px; gap: 9px; align-items: center;
      padding: 9px 9px; text-align: left; border: 1px solid transparent; border-radius: 13px; background: transparent; color: var(--muted);
    }
    .lesson-link:hover { background: rgba(255,255,255,.04); color: var(--ink); }
    .lesson-link.active { border-color: rgba(142,155,255,.35); background: rgba(142,155,255,.12); color: var(--ink); }
    .lesson-num { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; color: var(--quiet); background: rgba(255,255,255,.06); font-size: 11px; font-weight: 800; }
    .lesson-link.active .lesson-num { background: var(--accent); color: #090d18; }
    .lesson-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .lesson-time { display: block; margin-top: 2px; color: var(--quiet); font-size: 11px; font-weight: 500; }
    .lesson-check { color: var(--accent-2); font-size: 16px; opacity: 0; }
    .lesson-link.done .lesson-check { opacity: 1; }
    .sidebar-foot { margin: 22px 10px 0; padding-top: 17px; border-top: 1px solid var(--line); }
    .sidebar-foot a { color: var(--muted); font-size: 13px; text-decoration: none; }
    .sidebar-foot a:hover { color: var(--ink); }
    .main { min-width: 0; }
    .content { width: min(1080px, 100%); margin: 0 auto; padding: 52px 42px 90px; }
    .course-intro {
      display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 34px; align-items: center;
      padding: 30px; margin-bottom: 28px; border: 1px solid var(--line); border-radius: 24px;
      background: linear-gradient(135deg, rgba(21,30,52,.94), rgba(15,21,39,.9)); box-shadow: var(--shadow);
    }
    .course-intro h2 { margin: 0; max-width: 720px; font-size: clamp(32px, 4vw, 56px); line-height: 1.02; letter-spacing: -.065em; }
    .course-intro .lead { max-width: 640px; margin: 17px 0 0; color: var(--muted); font-size: 18px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .tag { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.035); font-size: 12px; }
    .tag.accent { border-color: rgba(67,213,192,.3); color: #a5f1e6; background: rgba(67,213,192,.08); }
    .intro-visual { min-height: 250px; position: relative; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: radial-gradient(circle at center, rgba(142,155,255,.17), transparent 55%), #0b1121; }
    .intro-visual::before, .intro-visual::after { content: ""; position: absolute; border: 1px solid rgba(142,155,255,.18); border-radius: 50%; }
    .intro-visual::before { width: 225px; height: 225px; }
    .intro-visual::after { width: 150px; height: 150px; border-color: rgba(67,213,192,.2); }
    .core { position: relative; z-index: 1; display: grid; place-items: center; width: 94px; height: 94px; border-radius: 30px; background: linear-gradient(145deg, #919bff, #5362df); color: #080d1a; font-size: 20px; font-weight: 900; letter-spacing: -.06em; box-shadow: 0 16px 40px rgba(90,104,244,.42); }
    .orbit-label { position: absolute; z-index: 2; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: rgba(9,13,24,.85); font-size: 11px; }
    .orbit-label.one { top: 28px; left: 32px; } .orbit-label.two { top: 34px; right: 28px; } .orbit-label.three { bottom: 32px; left: 31px; } .orbit-label.four { right: 29px; bottom: 36px; }
    .lesson-header { margin: 32px 0 26px; }
    .lesson-header h2 { margin: 0; max-width: 780px; font-size: clamp(32px, 4vw, 52px); line-height: 1.04; letter-spacing: -.06em; }
    .lesson-header .summary { max-width: 780px; margin: 15px 0 0; color: var(--muted); font-size: 18px; }
    .lesson-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .meta { color: var(--quiet); font-size: 12px; }
    .meta + .meta::before { content: "·"; margin: 0 8px; color: var(--line-strong); }
    .outcome-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 23px 0 30px; }
    .outcome { min-height: 92px; padding: 14px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.03); }
    .outcome small { display: block; color: var(--accent-2); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .outcome p { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .lesson-grid { display: grid; grid-template-columns: minmax(0, 1fr) 285px; gap: 26px; align-items: start; }
    .lesson-body { min-width: 0; }
    .lesson-section { margin-bottom: 28px; }
    .lesson-section h3 { margin: 0 0 10px; font-size: 23px; letter-spacing: -.03em; }
    .lesson-section p { margin: 0 0 12px; color: var(--muted); }
    .lesson-section ul { margin: 9px 0 0; padding-left: 21px; color: var(--muted); }
    .lesson-section li { margin: 7px 0; }
    .lesson-section strong, .lesson-body strong { color: var(--ink); }
    .callout { margin: 17px 0; padding: 17px 18px; border: 1px solid rgba(142,155,255,.25); border-left: 3px solid var(--accent); border-radius: 0 14px 14px 0; background: rgba(142,155,255,.08); }
    .callout.green { border-color: rgba(67,213,192,.24); border-left-color: var(--accent-2); background: rgba(67,213,192,.07); }
    .callout.warm { border-color: rgba(255,191,105,.25); border-left-color: var(--warm); background: rgba(255,191,105,.07); }
    .callout p:last-child { margin-bottom: 0; }
    .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 17px 0 4px; }
    .flow-node { padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.04); color: var(--ink); font-size: 13px; font-weight: 800; }
    .flow-node.highlight { border-color: rgba(67,213,192,.35); background: rgba(67,213,192,.1); }
    .flow-arrow { color: var(--quiet); font-size: 17px; }
    .code-card { margin: 16px 0; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; background: #080c16; }
    .code-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--quiet); font-size: 12px; }
    .copy-button { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.04); color: var(--muted); font-size: 11px; }
    .copy-button:hover { color: var(--ink); border-color: var(--line-strong); }
    pre { margin: 0; padding: 16px; overflow-x: auto; color: #dce3ff; font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre-wrap; }
    .step-list { display: grid; gap: 9px; margin: 15px 0; }
    .step { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 11px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.025); }
    .step-no { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; color: #090d18; background: var(--warm); font-size: 12px; font-weight: 900; }
    .step p { margin: 0; font-size: 14px; }
    .quiz { margin: 30px 0; padding: 22px; border: 1px solid var(--line-strong); border-radius: 18px; background: linear-gradient(145deg, rgba(21,30,52,.8), rgba(12,18,32,.8)); }
    .quiz-label { margin: 0 0 8px; color: var(--warm); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .quiz h3 { margin-bottom: 14px; }
    .quiz-options { display: grid; gap: 8px; }
    .quiz-option { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.035); color: var(--muted); text-align: left; }
    .quiz-option:hover { border-color: var(--accent); color: var(--ink); }
    .quiz-option.correct { border-color: var(--accent-2); background: rgba(67,213,192,.12); color: #bafff2; }
    .quiz-option.incorrect { border-color: var(--danger); background: rgba(255,128,137,.1); color: #ffc2c8; }
    .quiz-feedback { min-height: 25px; margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .side-card { position: sticky; top: 95px; padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: rgba(16,23,42,.74); }
    .side-card + .side-card { margin-top: 13px; }
    .side-card h3 { margin: 0 0 10px; font-size: 15px; }
    .side-card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .side-card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .side-card li { margin: 7px 0; }
    .side-card a { color: #c9ceff; text-decoration: none; }
    .side-card a:hover { text-decoration: underline; }
    .checklist { display: grid; gap: 8px; }
    .check-row { display: flex; align-items: flex-start; gap: 9px; color: var(--muted); font-size: 13px; line-height: 1.42; }
    .check-row input { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 2px; accent-color: var(--accent-2); }
    .check-row.checked { color: var(--quiet); text-decoration: line-through; }
    .note-box { width: 100%; min-height: 108px; resize: vertical; margin-top: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 11px; background: rgba(0,0,0,.2); color: var(--ink); font-size: 13px; line-height: 1.5; }
    .note-box::placeholder { color: var(--quiet); }
    .save-note { margin-top: 8px; color: var(--quiet); font-size: 11px; }
    .lesson-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
    .footer-actions { display: flex; gap: 9px; }
    .complete-button { min-width: 156px; }
    .complete-button.completed { background: rgba(67,213,192,.13); border-color: rgba(67,213,192,.35); color: #adfff1; }
    .resource-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .resource-link { display: inline-flex; align-items: center; min-height: 31px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); text-decoration: none; font-size: 12px; }
    .resource-link:hover { color: var(--ink); border-color: var(--line-strong); }
    .mobile-backdrop { display: none; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 50; max-width: 300px; padding: 12px 14px; border: 1px solid rgba(67,213,192,.35); border-radius: 12px; background: #112a2a; color: #c9fff5; font-size: 13px; box-shadow: var(--shadow); transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 950px) {
      :root { --sidebar: 280px; }
      .content { padding: 40px 28px 80px; }
      .course-intro { grid-template-columns: minmax(0,1fr) 260px; padding: 24px; }
      .lesson-grid { grid-template-columns: minmax(0,1fr) 250px; gap: 18px; }
    }
    @media (max-width: 760px) {
      .topbar { height: 64px; padding: 0 16px; }
      .icon-button { display: grid; place-items: center; }
      .progress-chip { display: none; }
      .layout { display: block; }
      .sidebar { position: fixed; z-index: 40; top: 64px; left: 0; bottom: 0; width: min(88vw, 330px); height: auto; transform: translateX(-105%); transition: transform .25s ease; box-shadow: 18px 0 50px rgba(0,0,0,.35); }
      .sidebar.open { transform: translateX(0); }
      .mobile-backdrop { position: fixed; inset: 64px 0 0; z-index: 30; background: rgba(0,0,0,.55); }
      .mobile-backdrop.show { display: block; }
      .content { padding: 28px 16px 70px; }
      .course-intro { grid-template-columns: 1fr; gap: 22px; padding: 22px; border-radius: 19px; }
      .course-intro h2 { font-size: 38px; }
      .course-intro .lead { font-size: 16px; }
      .intro-visual { min-height: 200px; }
      .lesson-header { margin-top: 28px; }
      .lesson-header h2 { font-size: 38px; }
      .lesson-header .summary { font-size: 16px; }
      .outcome-strip { grid-template-columns: 1fr; }
      .lesson-grid { grid-template-columns: 1fr; }
      .side-card { position: static; }
      .lesson-footer { align-items: stretch; flex-direction: column; }
      .footer-actions { justify-content: space-between; }
      .footer-actions button { flex: 1; }
    }
    @media (max-width: 440px) {
      .brand-copy span { display: none; }
      .top-actions .outline-button { display: none; }
      .lesson-header h2, .course-intro h2 { font-size: 32px; }
      .flow { gap: 5px; }
      .flow-node { font-size: 12px; padding: 8px 9px; }
      .flow-arrow { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <button class="icon-button" id="menuButton" aria-label="Open course menu" aria-expanded="false">☰</button>
        <div class="brand-mark" aria-hidden="true">C</div>
        <div class="brand-copy"><strong>CODEX FIELD GUIDE</strong><span>Mac-first interactive course</span></div>
      </div>
      <div class="top-actions">
        <div class="progress-chip" aria-label="Course progress"><span id="topProgressText">0 of 14 complete</span><span class="progress-bar" aria-hidden="true"><span id="topProgressBar"></span></span></div>
        <button class="outline-button" id="resetButton" type="button">Reset progress</button>
      </div>
    </header>
    <div class="mobile-backdrop" id="mobileBackdrop"></div>
    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Course lessons">
        <div class="sidebar-intro">
          <p class="eyebrow">Your route</p>
          <h1>From first launch to confident building.</h1>
          <p>Work through one bounded lesson at a time. Your progress stays on this device.</p>
          <div class="side-progress">
            <div class="side-progress-row"><span>Course progress</span><strong id="sideProgressText">0%</strong></div>
            <div class="progress-bar" aria-hidden="true"><span id="sideProgressBar"></span></div>
          </div>
        </div>
        <nav class="lesson-nav" id="lessonNav"></nav>
        <div class="sidebar-foot"><a href="https://openai.com/codex/" target="_blank" rel="noreferrer">Official Codex overview ↗</a></div>
      </aside>
      <main class="main" id="mainContent"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const COURSE_KEY = 'codex-field-guide-v1';
    const lessonData = [
      {
        id: 'mental-model', number: '01', title: 'What Codex is', short: 'The mental model', time: '25 min', category: 'Foundation',
        summary: 'Build a useful mental model before you install anything: Codex is an agent that can inspect, change, run, and verify work inside a project.',
        outcomes: ['Explain what makes an agent different from a chatbot.', 'Describe the relationship between a project, thread, terminal, Git, and GitHub.', 'Use the core loop: context + instructions + verification.'],
        flow: ['You give a goal', 'Codex inspects', 'Codex changes', 'You verify'],
        sections: [
          { heading: 'The short definition', paragraphs: ['A normal chat answer gives you information or a code snippet. A coding agent can pursue a software goal through a sequence of actions: read the project, plan the work, edit files, run commands, test the result, and explain what happened.', 'You remain the owner of the decision. Codex is the capable collaborator operating inside the boundaries you give it.'] },
          { heading: 'The pieces you will keep seeing', bullets: ['<strong>Project / workspace:</strong> the folder or repository Codex is allowed to inspect and change.', '<strong>Thread:</strong> one focused conversation about a piece of work.', '<strong>Terminal:</strong> the text-based interface used to run commands.', '<strong>Git:</strong> local history for your project.', '<strong>GitHub:</strong> an online home for Git repositories.', '<strong>Context:</strong> the information Codex has available when it decides what to do.'] },
          { heading: 'The quality equation', paragraphs: ['Most disappointing agent results are not mysterious. Codex lacked useful context, the request left important decisions implicit, or nobody verified the result.', 'Use this sequence throughout the course: <strong>inspect → explain → plan → implement → test → review</strong>.'] },
          { heading: 'A better first instruction', paragraphs: ['When you do not yet understand a project, ask for inspection before editing. This creates a shared map and makes mistakes easier to spot.'] },
        ],
        code: { label: 'A safe inspection prompt', value: 'Inspect this project first.\nDo not modify any files.\nExplain:\n1. What the project does\n2. How the folders are organised\n3. Which files control the main user flow\n4. What commands are available\n5. Any risks or missing information you found' },
        quiz: { question: 'Which instruction is stronger for a broken Contact button on mobile?', options: ['Fix button.', 'Inspect the project and investigate why the Contact button does not work on mobile. Identify the cause first, fix it without changing desktop behaviour, and test the mobile navigation afterwards.'], answer: 1, explanation: 'The second instruction gives Codex a goal, a boundary, and a verification step. That is the pattern you will reuse.' },
        checklist: ['I can explain the difference between a chatbot and an agent.', 'I know that a thread is one focused conversation.', 'I understand why inspection comes before editing.'],
        notePrompt: 'In one sentence, what do you want Codex to help you build?',
        resources: [['Codex overview', 'https://openai.com/codex/']]
      },
      {
        id: 'mac-setup', number: '02', title: 'Set up your Mac', short: 'Mac readiness', time: '30 min', category: 'Setup',

          { heading: 'The first three messages', bullets: ['Ask Codex to inspect and explain the project without changing files.', 'Ask for a bounded plan for one improvement. Ask it to name files, risks, and tests.', 'Only then authorise implementation, with a clear “do not modify unrelated files” boundary.'] },
          { heading: 'Permissions are part of the design', paragraphs: ['Codex may need permission to read files, run a command, or use a network-connected tool. Treat approvals as decisions, not interruptions. Before approving, ask: <strong>what will this action touch, why is it needed, and can I verify the result?</strong>'] },

      {
        id: 'terminal', number: '04', title: 'Use the Terminal without fear', short: 'Terminal essentials', time: '35 min', category: 'Foundations',
        summary: 'Learn the small set of commands that help you understand where you are, inspect a folder, and run a project.',

        sections: [

          { heading: 'The commands you need first', bullets: ['<strong>pwd</strong> — print the current folder.', '<strong>ls</strong> — list files and folders.', '<strong>cd folder-name</strong> — move into a folder.', '<strong>cd ..</strong> — move up one level.', '<strong>mkdir name</strong> — create a folder.', '<strong>open .</strong> — open the current folder in Finder.', '<strong>clear</strong> — clear the visible screen; it does not delete anything.'] },
          { heading: 'Read commands as sentences', paragraphs: ['In <strong>cd ~/Documents/CodexPractice</strong>, the command is “change directory to this path.” In <strong>ls -la</strong>, <strong>-la</strong> are options that ask for a more detailed listing. You do not need to memorise every option: ask Codex to explain unfamiliar commands.'] },

        checklist: ['I can explain what pwd does.', 'I can list and enter a folder.', 'I know how to move up one level.', 'I will stop and ask before running unfamiliar destructive commands.'],

      {

        summary: 'Understand repositories, commits, branches, and pushes so every Codex change has a visible history and a safe place to live.',
        outcomes: ['Distinguish Git from GitHub.', 'Use a feature branch for a bounded change.', 'Read a diff and commit only work you understand.'],
        flow: ['Edit locally', 'Review diff', 'Commit', 'Push branch'],
        sections: [
          { heading: 'Git is local history', paragraphs: ['Git records snapshots of your project and the differences between them. A commit is a named checkpoint. A branch is an independent line of work that lets you experiment without changing the main line immediately.'] },

          { heading: 'Never confuse force with progress', paragraphs: ['Commands such as <strong>git push --force</strong> can overwrite remote history. They are not routine repair commands. If a Codex instruction proposes a history rewrite, ask why, identify the exact branch, and confirm that the data loss risk is acceptable.'] },

        checklist: ['I understand Git is local version history.', 'I understand GitHub is an online repository service.', 'I can read the purpose of git status and git diff.', 'I know that force-pushing needs special care.'],

      {

        summary: 'Learn how to orient yourself in a real repository before requesting a feature or fix.',
        outcomes: ['Find the project entrypoint and available scripts.', 'Separate frontend, backend, data, and configuration concerns.', 'Ask Codex for an evidence-based architecture map.'],
        flow: ['README', 'Scripts', 'Entrypoints', 'Dependencies'],

          { heading: 'A practical orientation checklist', bullets: ['Find the user-facing entrypoint: page, route, or application root.', 'Find server or API entrypoints if they exist.', 'Find data models, migrations, or database access.', 'Find environment-variable examples without exposing secrets.', 'Find test and build commands.', 'Identify generated files and vendor directories you should not edit directly.'] },

      {
        id: 'prompting', number: '08', title: 'Write instructions that work', short: 'Context engineering', time: '45 min', category: 'Core skill',
        summary: 'Turn a vague request into a bounded specification with context, constraints, acceptance criteria, and a verification plan.',
        outcomes: ['Write a task using outcome, context, constraints, and acceptance criteria.', 'Decompose a large request into safe slices.', 'Use inspect → plan → implement → verify deliberately.'],
        flow: ['Outcome', 'Context', 'Constraints', 'Acceptance'],
        sections: [
          { heading: 'The four-part task brief', bullets: ['<strong>Outcome:</strong> what should be true when the work is done?', '<strong>Context:</strong> where in the project does this belong, and who is it for?', '<strong>Constraints:</strong> what must remain unchanged, what tools are allowed, and what is out of scope?', '<strong>Acceptance:</strong> how will we know it works?'] },
          { heading: 'Use progressive disclosure', paragraphs: ['Do not paste the whole project into the first message. Ask Codex to inspect the smallest relevant surface, then add detail as it becomes necessary. This is more reliable than producing an enormous prompt full of assumptions.'] },
          { heading: 'Decompose by risk and verification', paragraphs: ['A good slice has a clear input, a bounded change, and a visible way to test it. For example: first add the empty state, then add data loading, then handle the error state. Each step produces evidence for the next.'] },
          { heading: 'A reusable task template', paragraphs: ['Use the following structure whenever a request matters: <strong>Role / outcome / current context / boundaries / implementation notes / acceptance criteria / verification report</strong>. You can leave a section blank, but do not leave critical constraints implied.'] },
        ],
        code: { label: 'A reusable Codex task brief', value: 'Outcome: [what should be true]\nContext: [user, page, route, or files involved]\nConstraints: [what must not change; out of scope]\nImplementation: inspect first, then propose a plan\nAcceptance criteria:\n- [observable behaviour 1]\n- [observable behaviour 2]\nVerification: run [commands/tests] and report failures or uncertainty' },
        quiz: { question: 'Which item turns “make it better” into something testable?', options: ['A stronger adjective.', 'Acceptance criteria describing observable behaviour.', 'A longer list of technologies.'], answer: 1, explanation: 'Acceptance criteria describe the evidence that would make the request complete.' },
        checklist: ['I can write an observable outcome.', 'I can name constraints and out-of-scope work.', 'I can describe how the result will be tested.', 'I can split a large task into smaller slices.'],
        notePrompt: 'Rewrite one project idea using outcome, context, constraints, and acceptance criteria.',
        resources: [['Codex overview', 'https://openai.com/codex/']]
      },

          { heading: 'Define the first version', bullets: ['Show a clear page title and three columns.', 'Allow a user to add a task with a title.', 'Allow a task to move between columns.', 'Persist tasks locally in the browser.', 'Show a useful empty state.', 'Do not add accounts, payments, analytics, or remote data in version one.'] },

        id: 'debugging', number: '11', title: 'Debug without guessing', short: 'Systematic debugging', time: '40 min', category: 'Problem solving',
        summary: 'When something breaks, turn it into a repeatable investigation instead of asking for random fixes.',
        outcomes: ['Capture a reliable reproduction.', 'Separate symptoms from likely causes.', 'Apply the smallest fix and retest the original failure.'],
        flow: ['Reproduce', 'Observe', 'Hypothesise', 'Fix + retest'],
        sections: [
          { heading: 'The debugging loop', bullets: ['<strong>Reproduce:</strong> write the exact steps, inputs, and environment.', '<strong>Observe:</strong> capture the error, network response, console output, or unexpected state.', '<strong>Hypothesise:</strong> name one or two plausible causes based on evidence.', '<strong>Change one thing:</strong> keep the fix as small as possible.', '<strong>Retest:</strong> repeat the original failure and check nearby behaviour.'] },
          { heading: 'Give Codex the evidence', paragraphs: ['“It does not work” is a symptom. Include the URL or route, the click sequence, the exact error text, timestamps if relevant, and what you expected instead. Do not paste secrets or tokens into the conversation.'] },
          { heading: 'Avoid the fix cascade', paragraphs: ['A fix cascade happens when each guess creates another change before the first hypothesis is tested. Ask Codex to diagnose first and to explain why the smallest proposed change should address the evidence.'] },
          { heading: 'When the environment is the problem', paragraphs: ['Some failures come from stale processes, missing environment variables, network access, permissions, or a mismatched dependency. Keep application bugs separate from environment failures so you do not rewrite correct code to compensate for a setup issue.'] },
        ],
        code: { label: 'A debugging report', value: 'Problem: [one-sentence symptom]\nReproduction:\n1. [step]\n2. [step]\nExpected: [what should happen]\nActual: [what happens]\nEvidence: [exact error / console / response]\nEnvironment: [browser, branch, command]\nFirst diagnose the likely cause. Do not edit files until you explain the hypothesis and the smallest fix.' },
        quiz: { question: 'What is the first goal of a useful reproduction?', options: ['Make the bug sound dramatic.', 'Make the failure repeatable so a proposed fix can be tested against the same evidence.', 'Change several files quickly.'], answer: 1, explanation: 'Repeatability turns a vague report into a testable problem.' },
        checklist: ['I can write exact reproduction steps.', 'I record expected versus actual behaviour.', 'I ask for diagnosis before a broad fix.', 'I retest the original failure after a change.'],
        notePrompt: 'Describe a real bug using Problem, Reproduction, Expected, Actual, and Evidence.',

          { heading: 'Good instructions are operational', paragraphs: ['“Write clean code” is too vague. “Run npm test before reporting completion; keep API routes under src/server/routes; do not edit generated files in dist” is observable and useful.'] },

      {

        outcomes: ['Choose when parallel agent work is safe.', 'Separate exploration, implementation, and review.', 'Design handoffs that include evidence and a clean boundary.'],
        flow: ['Decompose', 'Isolate', 'Implement', 'Review'],
        sections: [
          { heading: 'Parallel work is a coordination problem', paragraphs: ['Multiple agents help when tasks are genuinely independent and each has a clear file or feature boundary. They create risk when two agents edit the same core files, rely on each other’s unfinished changes, or have conflicting assumptions.'] },
          { heading: 'A safe delegation brief', bullets: ['State the exact goal and non-goals.', 'Name the files or area the agent may touch.', 'Require a returned summary, diff, tests, and unresolved questions.', 'Do not let a delegated task publish or change credentials without an explicit owner decision.'] },
          { heading: 'Worktrees and branches', paragraphs: ['A worktree gives a branch its own working directory. It is useful when you need to inspect or implement changes in parallel without one agent overwriting another’s files. Merge only after each branch is understood and tested.'] },
          { heading: 'The reviewer is a separate mindset', paragraphs: ['Ask a review pass to look for missing requirements, regressions, security issues, and tests—not to rewrite the feature automatically. A good review can be more valuable when it is not biased by the implementation conversation.'] },
        ],
        code: { label: 'Delegation brief', value: 'Task: investigate the mobile navigation bug.\nScope: inspect and edit only src/components/Nav and related tests.\nDo not change routing, dependencies, or visual branding.\nReturn:\n- root cause with evidence\n- files changed\n- tests run and results\n- remaining uncertainty\nDo not publish or push changes.' },
        quiz: { question: 'When is parallel agent work a poor choice?', options: ['When tasks have separate files and clear contracts.', 'When agents will edit the same core files or depend on undocumented unfinished work.', 'When each task has acceptance criteria.'], answer: 1, explanation: 'Shared mutable state and unclear handoffs create merge conflicts and reasoning errors.' },
        checklist: ['I can identify independent versus coupled tasks.', 'I can write a bounded delegation brief.', 'I know a reviewer should report risks before rewriting.', 'I understand branches and worktrees isolate work.'],
        notePrompt: 'Split one future project into two tasks that could safely be worked on independently.',
        resources: [['Git worktrees', 'https://git-scm.com/docs/git-worktree']]
      },
      {
        id: 'apis-data-mcp', number: '14', title: 'Connect APIs, data, and tools', short: 'External systems', time: '50 min', category: 'Advanced',
        summary: 'Understand the boundaries that matter when a project talks to APIs, databases, browsers, or MCP tools.',
        outcomes: ['Separate environment variables from source code and secrets.', 'Describe a safe external-data integration.', 'Use tools and connectors with explicit scope and verification.'],
        flow: ['Secret boundary', 'HTTP/API', 'Data shape', 'Verify failure'],
        sections: [
          { heading: 'Environment variables are configuration', paragraphs: ['API keys, database URLs, and service settings belong in the environment or a secrets manager, not in source files or prompts. Commit an <strong>.env.example</strong> with placeholder names, never real credentials.'] },
          { heading: 'An API is a contract', bullets: ['What URL and method are used?', 'What authentication is required?', 'What request and response shapes are expected?', 'What are the timeout, rate-limit, and retry rules?', 'What happens when the service is unavailable or returns bad data?'] },
          { heading: 'Databases need ownership and migration discipline', paragraphs: ['A schema is part of the product. Before changing it, identify the tables, constraints, existing data, and migration strategy. Never treat production data as disposable test data.'] },
          { heading: 'MCP and browser tools', paragraphs: ['Model Context Protocol can connect Codex to external context or developer tools. A tool connection should be scoped to the task and reviewed like any other permission. “The tool can access it” does not mean “the tool should access everything.”'] },
          { heading: 'Design for failure', paragraphs: ['External systems time out, rate-limit, return partial data, and change their contracts. Ask Codex to build visible loading, empty, error, retry, and stale-data states—and to test at least one failure path.'] },
        ],
        code: { label: 'External integration brief', value: 'Add a read-only weather integration.\nDo not expose the API key to the browser.\nInspect the existing configuration and data-fetching conventions first.\nDefine timeout, error, empty, and stale-data behaviour.\nUse a typed response boundary and validate the provider response.\nAdd a test for the provider failure path.\nShow the plan before editing.' },
        quiz: { question: 'Where should a private API key normally live?', options: ['Hard-coded in a frontend file so the browser can use it.', 'In an environment or secrets manager, with only a placeholder name in source-controlled examples.', 'Inside a screenshot of the configuration.'], answer: 1, explanation: 'A browser-delivered secret is no longer secret. Keep private credentials on a trusted server or managed secret store.' },
        checklist: ['I know not to paste or commit secrets.', 'I can describe an API contract and failure states.', 'I understand that database changes need migration discipline.', 'I will scope tools and connectors to the task.'],
        notePrompt: 'Name one external service your project might use and list its main failure state.',
        resources: [['OpenAI Codex MCP guide', 'https://developers.openai.com/codex/mcp'], ['OpenAI Developers', 'https://developers.openai.com/codex/']]
      },
      {
        id: 'capstone', number: '15', title: 'Capstone: build with confidence', short: 'Final project', time: '90 min+', category: 'Capstone',
        summary: 'Bring the complete workflow together on a project that matters to you: brief it, build it, test it, review it, and explain it.',
        outcomes: ['Write a complete project brief.', 'Use staged implementation and verification.', 'Hand off a project with clear instructions and known limitations.'],
        flow: ['Brief', 'Map', 'Plan', 'Build', 'Verify'],
        sections: [
          { heading: 'Choose a useful, bounded project', paragraphs: ['Good capstones are small enough to finish but meaningful enough that you care about the result. Examples: a knowledge-base assistant prototype, an investment research dashboard using sample data, a content-planning tool, or an internal calculator.'] },
          { heading: 'Your capstone brief', bullets: ['Who is the user and what decision or action should the project support?', 'What is the smallest useful version?', 'What data is real, simulated, or user-entered?', 'What is explicitly out of scope?', 'What are five observable acceptance criteria?', 'How will you test the main flow and one failure path?'] },
          { heading: 'The complete Codex prompt', paragraphs: ['Start with the prompt below. Let Codex inspect your project, ask for missing context only when necessary, and produce a plan before making changes. Keep the first implementation slice small enough to verify in one sitting.'] },
          { heading: 'Your final handoff', paragraphs: ['A professional handoff includes the project purpose, how to run it, what changed, tests and manual checks completed, known limitations, security or data assumptions, and the next sensible improvement. That is the standard you can now ask Codex to meet.'] },
        ],
        code: { label: 'Capstone master prompt', value: 'You are working on my capstone project.\nFirst inspect the repository and read the project instructions. Do not edit yet.\nExplain the current architecture, relevant files, available commands, and unknowns.\nThen propose a staged implementation plan for this brief:\n\nUser: [who this is for]\nOutcome: [what they need to do]\nFirst version: [smallest useful scope]\nOut of scope: [what must wait]\nAcceptance criteria:\n- [criterion 1]\n- [criterion 2]\n- [criterion 3]\n- [criterion 4]\n- [criterion 5]\n\nAfter I approve the plan, implement only the first slice. Run the relevant checks, show the diff, and report passed checks, failures, and remaining uncertainty.' },
        quiz: { question: 'What makes a capstone “complete” for this course?', options: ['It has the most features possible.', 'It has a bounded useful outcome, a documented workflow, tested acceptance criteria, and an honest account of limitations.', 'Codex says it is finished.'], answer: 1, explanation: 'Completion is evidence plus a clear handoff—not feature count or confidence language.' },
        checklist: ['I wrote a user and outcome for my project.', 'I defined a first version and out-of-scope list.', 'I wrote observable acceptance criteria.', 'I tested the main flow and one failure path.', 'I can explain what remains uncertain.'],
        notePrompt: 'Write the name and one-sentence outcome of your capstone project.',
        resources: [['Codex overview', 'https://openai.com/codex/'], ['Codex MCP', 'https://developers.openai.com/codex/mcp']]
      }
    ];

    const state = loadState();
    let currentIndex = getInitialIndex();

    function defaultState() { return { completed: [], checks: {}, notes: {}, quizzes: {} }; }
    function loadState() {
      try { return { ...defaultState(), ...(JSON.parse(localStorage.getItem(COURSE_KEY)) || {}) }; }
      catch { return defaultState(); }
    }
    function saveState() { localStorage.setItem(COURSE_KEY, JSON.stringify(state)); updateProgress(); }
    function getInitialIndex() {
      const firstOpen = lessonData.findIndex(item => !state.completed.includes(item.id));
      return firstOpen === -1 ? lessonData.length - 1 : firstOpen;
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[ch]));
    }
    function renderNav() {
      const nav = document.getElementById('lessonNav');
      nav.innerHTML = lessonData.map((lesson, index) => `
        <button class="lesson-link ${index === currentIndex ? 'active' : ''} ${state.completed.includes(lesson.id) ? 'done' : ''}" data-index="${index}" type="button" aria-current="${index === currentIndex ? 'page' : 'false'}">
          <span class="lesson-num">${lesson.number}</span>
          <span><span class="lesson-title">${lesson.short}</span><span class="lesson-time">${lesson.time}</span></span>
          <span class="lesson-check" aria-hidden="true">✓</span>
        </button>`).join('');
      nav.querySelectorAll('.lesson-link').forEach(button => button.addEventListener('click', () => { currentIndex = Number(button.dataset.index); render(); closeMenu(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
    }
    function render() {
      renderNav();
      const lesson = lessonData[currentIndex];
      const isDone = state.completed.includes(lesson.id);
      const checks = state.checks[lesson.id] || [];
      const savedNote = state.notes[lesson.id] || '';
      const quizValue = state.quizzes[lesson.id];
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="content">
          <section class="course-intro" aria-label="Course introduction">
            <div>
              <p class="eyebrow">Codex course · learn by building</p>
              <h2>Make the agent useful by making the work clear.</h2>
              <p class="lead">A Mac-first path from your first launch to a tested, documented project you understand.</p>
              <div class="tag-row"><span class="tag accent">15 guided lessons</span><span class="tag">Interactive checkpoints</span><span class="tag">Progress saved locally</span></div>
            </div>
            <div class="intro-visual" aria-label="A diagram showing Codex connecting context, instructions, project, and verification">
              <span class="orbit-label one">Context</span><span class="orbit-label two">Project</span><span class="orbit-label three">Tests</span><span class="orbit-label four">Review</span><span class="core">CODEX</span>
            </div>
          </section>
          <section class="lesson-header" aria-labelledby="lesson-title">
            <p class="eyebrow">Lesson ${lesson.number} · ${lesson.category}</p>
            <h2 id="lesson-title">${lesson.title}</h2>
            <p class="summary">${lesson.summary}</p>
            <div class="lesson-meta"><span class="meta">${lesson.time}</span><span class="meta">Work through the checkpoint</span><span class="meta">${isDone ? 'Completed' : 'Not completed'}</span></div>
          </section>
          <div class="outcome-strip">${lesson.outcomes.map((item, i) => `<div class="outcome"><small>By the end · 0${i + 1}</small><p>${item}</p></div>`).join('')}</div>
          <div class="lesson-grid">
            <article class="lesson-body">
              <div class="flow" aria-label="Lesson flow">${lesson.flow.map((item, i) => `<span class="flow-node ${i === lesson.flow.length - 1 ? 'highlight' : ''}">${item}</span>${i < lesson.flow.length - 1 ? '<span class="flow-arrow" aria-hidden="true">→</span>' : ''}`).join('')}</div>
              ${lesson.sections.map(section => `<section class="lesson-section"><h3>${section.heading}</h3>${(section.paragraphs || []).map(p => `<p>${p}</p>`).join('')}${section.bullets ? `<ul>${section.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}</section>`).join('')}
              <div class="code-card"><div class="code-head"><span>${lesson.code.label}</span><button class="copy-button" type="button" data-copy="${encodeURIComponent(lesson.code.value)}">Copy</button></div><pre><code>${escapeHtml(lesson.code.value)}</code></pre></div>
              <div class="quiz" data-quiz="${lesson.id}"><p class="quiz-label">Checkpoint</p><h3>${lesson.quiz.question}</h3><div class="quiz-options">${lesson.quiz.options.map((option, i) => `<button type="button" class="quiz-option ${quizValue === i ? (i === lesson.quiz.answer ? 'correct' : 'incorrect') : ''}" data-answer="${i}">${String.fromCharCode(65 + i)}. ${option}</button>`).join('')}</div><p class="quiz-feedback" id="quizFeedback">${quizValue === undefined ? 'Choose an answer to check your understanding.' : (quizValue === lesson.quiz.answer ? 'Correct. ' : 'Not quite. ') + lesson.quiz.explanation}</p></div>
              <div class="callout green"><p><strong>Practice before moving on.</strong> Tick the actions you completed, write a short note if useful, then mark the lesson complete. You can revisit any lesson from the course map.</p></div>
              <div class="lesson-footer"><button class="primary-button complete-button ${isDone ? 'completed' : ''}" id="completeButton" type="button">${isDone ? '✓ Completed' : 'Mark lesson complete'}</button><div class="footer-actions"><button class="ghost-button" id="prevButton" type="button" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button><button class="ghost-button" id="nextButton" type="button" ${currentIndex === lessonData.length - 1 ? 'disabled' : ''}>Next →</button></div></div>
            </article>
            <aside class="lesson-side">
              <div class="side-card"><h3>Practice checklist</h3><div class="checklist">${lesson.checklist.map((item, i) => `<label class="check-row ${(checks[i] ? 'checked' : '')}"><input type="checkbox" data-check="${i}" ${checks[i] ? 'checked' : ''} /> <span>${item}</span></label>`).join('')}</div></div>
              <div class="side-card"><h3>Your note</h3><p>${lesson.notePrompt}</p><textarea class="note-box" id="noteBox" placeholder="Write a short note...">${escapeHtml(savedNote)}</textarea><div class="save-note" id="saveNote">Saved on this device</div></div>
              <div class="side-card"><h3>Further reading</h3><div class="resource-strip">${lesson.resources.map(([label, url]) => `<a class="resource-link" href="${url}" target="_blank" rel="noreferrer">${label} ↗</a>`).join('')}</div></div>
            </aside>
          </div>
        </div>`;
      bindLessonEvents(lesson);
      updateProgress();
    }
    function bindLessonEvents(lesson) {
      document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', async () => {
        const value = decodeURIComponent(button.dataset.copy);
        try { await navigator.clipboard.writeText(value); button.textContent = 'Copied'; showToast('Prompt copied to your clipboard.'); }
        catch { button.textContent = 'Select text'; showToast('Clipboard access was unavailable; the prompt is still visible above.'); }
        setTimeout(() => button.textContent = 'Copy', 1400);
      }));
      document.querySelectorAll('[data-answer]').forEach(button => button.addEventListener('click', () => {
        const answer = Number(button.dataset.answer); state.quizzes[lesson.id] = answer; saveState();
        document.querySelectorAll('[data-answer]').forEach(item => item.classList.remove('correct', 'incorrect'));
        button.classList.add(answer === lesson.quiz.answer ? 'correct' : 'incorrect');
        document.getElementById('quizFeedback').textContent = (answer === lesson.quiz.answer ? 'Correct. ' : 'Not quite. ') + lesson.quiz.explanation;
      }));
      document.querySelectorAll('[data-check]').forEach(input => input.addEventListener('change', () => {
        const checks = state.checks[lesson.id] || []; checks[Number(input.dataset.check)] = input.checked; state.checks[lesson.id] = checks; saveState(); input.closest('.check-row').classList.toggle('checked', input.checked);
      }));
      const note = document.getElementById('noteBox');
      note.addEventListener('input', () => { state.notes[lesson.id] = note.value; saveState(); document.getElementById('saveNote').textContent = 'Saved on this device'; });
      document.getElementById('completeButton').addEventListener('click', () => { toggleComplete(lesson.id); render(); showToast(state.completed.includes(lesson.id) ? 'Lesson marked complete.' : 'Lesson reopened.'); });
      document.getElementById('prevButton').addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; render(); window.scrollTo({top:0, behavior:'smooth'}); } });
      document.getElementById('nextButton').addEventListener('click', () => { if (currentIndex < lessonData.length - 1) { currentIndex++; render(); window.scrollTo({top:0, behavior:'smooth'}); } });
    }
    function toggleComplete(id) { state.completed = state.completed.includes(id) ? state.completed.filter(item => item !== id) : [...state.completed, id]; saveState(); }
    function updateProgress() {
      const completed = state.completed.length; const percent = Math.round((completed / lessonData.length) * 100); const width = `${percent}%`;
      document.getElementById('topProgressText').textContent = `${completed} of ${lessonData.length} complete`;
      document.getElementById('topProgressBar').style.width = width;
      document.getElementById('sideProgressText').textContent = `${percent}%`;
      document.getElementById('sideProgressBar').style.width = width;
    }
    function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }
    function closeMenu() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('mobileBackdrop').classList.remove('show'); document.getElementById('menuButton').setAttribute('aria-expanded', 'false'); }
    document.getElementById('menuButton').addEventListener('click', () => { const open = document.getElementById('sidebar').classList.toggle('open'); document.getElementById('mobileBackdrop').classList.toggle('show', open); document.getElementById('menuButton').setAttribute('aria-expanded', String(open)); });
    document.getElementById('mobileBackdrop').addEventListener('click', closeMenu);
    document.getElementById('resetButton').addEventListener('click', () => { if (confirm('Reset all course progress, checks, quiz answers, and notes on this device?')) { localStorage.removeItem(COURSE_KEY); Object.assign(state, defaultState()); currentIndex = 0; render(); showToast('Progress reset.'); } });
    render();
  </script>
</body>
</html>
